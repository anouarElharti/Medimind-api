[package]
name = "Medimind"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.34", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
uuid = { version = "1.7", features = ["v4"] }
argon2 = "0.5"
jsonwebtoken = "9.1"
surrealdb = { version = "1.0.0" }
env_logger = "0.10"
log = "0.4"
leptos = { version = "0.5", features = ["csr"] }
utoipa = { version = "4.2", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "5.0", features = ["actix-web"] }